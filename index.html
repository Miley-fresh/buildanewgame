var items={
  1:{name:"矮桌上的名片",scene:0,img:imgBase+"客厅/01_矮桌上的名片.png",text:"一张名片，正面印着\"城东派出所 陈建国警官\"。翻到背面，有人用圆珠笔写着：\"失踪超72小时，3月26日立案。\" 签名是一个女人的字迹——苏晴。\n\n她是报案人。",keyword:"报案人苏晴",type:"mislead"},
  2:{name:"沙发旁的信封",scene:0,img:imgBase+"客厅/02_沙发旁的信封.png",text:"一封物业寄来的催缴通知：\"尊敬的住户，您3月、4月的房租已逾期未缴，请尽快处理。\"\n\n连续两个月。如果只是出差几天，不至于连房租都不管。他是打算不回来了？",keyword:"意外失踪？",type:"neutral"},
  3:{name:"纸箱里的编程书",scene:0,img:imgBase+"客厅/03_纸箱里的编程书.png",text:"几本厚厚的编程书，有些折角。翻开其中一本，书页间掉出一张照片——一男一女在餐桌前举着酒杯笑。背面写着：\"2020年公司年会，和苏晴的第一张合照。\"",keyword:"旧日回忆",type:"mislead"},
  4:{name:"纸箱底部的旧信封",scene:0,img:imgBase+"客厅/04_纸箱底部的旧信封.png",text:"信封已经发黄，邮戳是2019年。里面是一封手写信，字迹工整但不太熟练：\n\n\"远儿，城里冷，多穿衣服。妈在家一切都好，你安心工作。家里的橘子树今年结了好多果，等你过年回来吃。\"\n\n落款：妈",keyword:"独自进城",type:"neutral"},
  5:{name:"沙发垫下的纸",scene:0,img:imgBase+"客厅/05_沙发垫下的纸.png",text:"一张A4纸，打印的邮件。日期2月28日，收件人是公司HR：\n\n\"您好，因家中有急事需要处理，我申请离职，望批准。给公司带来不便，深表歉意。——林远\"\n\n语气很平静，措辞正式。不像是情绪崩溃时写的，更像深思熟虑后的决定。",keyword:"计划离开",type:"truth"},
  6:{name:"日记本·前面的页",scene:1,img:imgBase+"卧室/01_日记本_前面的页.png",text:"2022年10月：妈打电话说体检查出了东西。我请假回到平远县陪她检查，她拉着我的手说'没事的'，可我看到了诊断单。回城的火车上，我一个人坐了六个小时，什么都没吃。",keyword:"母亲患病",type:"truth"},
  7:{name:"日记本·中间的页",scene:1,img:imgBase+"卧室/02_日记本_中间的页.png",text:"\"2023年9月8日\n\n最近总失眠，白天也集中不了精神，开会的时候脑子一片空白。去看了医生，说是焦虑症状，开了药。\n\n苏晴问我怎么了，我说工作累。我不知道怎么跟她说妈的事。说了又能怎样？她也帮不了。\n\n我好像越来越不会跟人说话了。\"",keyword:"焦虑",type:"distract"},
  8:{name:"日记本·最后一页",scene:1,img:imgBase+"卧室/03_日记本_最后一页.png",text:"\"2月22日\n\n收到妈的复查报告。\n\n晚期转移。\n\n她上个月的信里还说一切都好。她在信里还让我别担心。\n\n我还能装多久？\"\n\n字迹潦草，笔画用力很重，纸面上有凹痕。这是日记本的最后一页。",keyword:"癌症晚期",type:"truth"},
  9:{name:"抽屉里的信",scene:1,img:imgBase+"卧室/04_抽屉里的信.png",text:"信纸折得很整齐，日期写在右上角：1月15日。\n\n\"林远：\n\n我真的很累了。你什么都不跟我说，我不知道你在想什么。我觉得我们之间隔了一堵墙，我怎么敲都没有回应。\n\n也许我们不合适。我走了，别找我。\n\n——晴\"\n\n信纸上有几处水渍，不知道是谁的。",keyword:"分手",type:"mislead"},
  10:{name:"枕头下的东西",scene:1,img:imgBase+"卧室/05_枕头下的东西.png",text:"一张火车票，压得有些皱。\n\n出发站：本市  到达站：平远县\n日期：3月2日  单程\n\n背面用铅笔写了几个字：\"这才是最重要的。\"\n\n平远县。单程票。他没打算回来。",keyword:"不再回来",type:"truth"},
  11:{name:"冰箱上的便签",scene:2,img:imgBase+"厨房/01_冰箱上的便签.png",text:"一张撕下来的便签纸，字迹有些颤抖，像是上了年纪的人写的：\n\n\"小林，3月10日你的快递我放门口了。好久没见你了，一切还好吧？天冷了多穿点。\n\n——楼下老赵\"",keyword:"邻居的关心",type:"distract"},
  12:{name:"灶台旁揉皱的纸",scene:2,img:imgBase+"厨房/02_灶台旁揉皱的纸.png",text:"一张汇款单，被揉皱后又被小心地展开过，折痕很深。\n\n日期：2月20日\n汇款人：林秀珍（林远母亲）\n金额：2000元\n附言：\"儿子别为我花钱了，照顾好自己。\"\n\n一个晚期病人，还在给城里的儿子寄钱。",keyword:"母亲的关心",type:"truth"},
  13:{name:"垃圾桶里的瓶子",scene:2,img:imgBase+"厨房/03_垃圾桶里的瓶子.png",text:"从垃圾桶里翻出一个药瓶。标签上写着抗焦虑药物，处方日期2023年9月。\n\n瓶子里还剩几粒药片，连药带瓶一起被扔进了垃圾桶。不是吃完了——是连剩下的药一起丢掉的。\n\n为什么要把没吃完的药扔掉？",keyword:"丢弃的药瓶",type:"distract",comboFlag:"drug"},
  14:{name:"垃圾桶底部的纸片",scene:2,img:imgBase+"厨房/04_垃圾桶底部的纸片.png",text:"药瓶下面压着一张皱巴巴的收据。\n\n日期：2月25日\n科室：心理科\n项目：复查\n\n背面有医生的手写批注：\"近期情况明显好转，建议逐步减量至停药。继续保持。\"\n\n所以药瓶空了不是因为吃光了，也不是绝望——是医生说可以停药了。",keyword:"处方",type:"truth",comboFlag:"prescription"},
  15:{name:"冰箱里的东西",scene:2,img:imgBase+"厨房/05_冰箱里的东西.png",text:"冰箱里有几根蔫掉的青菜，一盒保质期到3月5日的牛奶，还有一盒没开封的鸡蛋。\n\n食材都过期了，但冰箱里还有没用完的东西——他走的时候没有清理，像是决定得很急，来不及处理这些琐事。",keyword:"过期食材",type:"distract"},
  16:{name:"外套口袋",scene:3,img:imgBase+"阳台/01_外套口袋.png",text:"外套口袋里摸到一张小纸条，很旧了，边角磨得起了毛，像是被反复折叠过很多次。\n\n上面是一个女孩的字迹：\"今天降温，我把我的围巾放你包里了。别逞强。——晴\"\n\n他一直留着这张纸条。",keyword:"温暖",type:"distract"},
  17:{name:"花盆里枯死的植物",scene:3,img:imgBase+"阳台/02_花盆里枯死的植物.png",text:"花盆里的植物早就枯了。拨开干硬的泥土，底下压着一张旧照片。\n\n照片上，一个年轻的男人搂着一个头发花白的女人，站在一栋老房子门口。背面写着：\"2019年春节，最后一次在家过年。\"\n\n五年了。",keyword:"过年的记忆",type:"truth"},
  18:{name:"角落的旅行袋",scene:3,img:imgBase+"阳台/03_角落的旅行袋.png",text:"一个黑色旅行袋，拉链敞开，里面什么都没有。\n\n侧面的小口袋里有一张电影票根，日期是去年情人节，两个座位号——和苏晴一起看的。票根旁边还有一个撕掉的行李牌，手写着\"平远县\"。\n\n她的回忆和他的目的地，装在同一个袋子里。",keyword:"行李牌的目的地",type:"mislead"}
};

var COMBO_TEXT="你把药瓶和收据放在一起看——收据压在药瓶下面，说明他先扔了收据（2月25日复查后），然后把药也扔了。\n\n他不是吃光了药，也不是绝望地丢掉——是看完医生、确认好转之后，主动停药了。";
var FULL_STORY="林远，平远县人，2019年独自来到城市做程序员。他在公司认识了苏晴，两人开始交往。2022年秋天，母亲被查出肺癌，林远开始定期寄钱回家，但没有告诉苏晴病情的严重程度。长期的压力让他患上了焦虑症，2023年秋天开始服药。他变得越来越封闭，什么都不愿意说。2024年1月，苏晴提出分手。2月，母亲的复查报告显示癌症已经晚期转移。同月，林远自己的心理复查显示症状明显好转，医生建议停药。他扔掉了药，写了辞职信，买了一张回平远县的单程火车票。3月2日，他离开了这座城市，回到母亲身边。他没有跟任何人告别。3月下旬，苏晴发现联系不上他，报了警。警方立案为失踪。但林远不是失踪——他只是选择了沉默的告别，回到最重要的人身边，陪她走完最后的路。";
var END_PERFECT="你把所有线索铺在桌上，时间线渐渐清晰了。\n\n1月，苏晴走了。2月，母亲的病恶化到了晚期。但同一个月，他的焦虑症在好转——医生说可以停药了。他把药扔了，写了辞职信，买了一张回平远县的单程火车票。\n\n他不是失踪，也不是崩溃。\n\n\"这才是最重要的。\"——火车票背面的字，是他对自己说的。\n\n他放弃了这座城市里的一切，回到那个叫平远的小县城，回到母亲身边。他没有告别，因为他知道有些选择说出口就会被劝住。\n\n他选择了沉默地离开，换一种方式陪伴最重要的人走完最后一程。\n\n你把信件放回纸箱，轻轻合上。窗外有阳光照进来，照在那张泛黄的母子合照上。";
var END_REGRET="你觉得他大概是回老家了。火车票、辞职信、母亲的病……所有线索都指向同一个方向。\n\n但那个空药瓶始终让你不安。你无法完全确定，他离开时的状态是否真的稳定。医生说好转了，可好转不等于痊愈。一个刚和女友分手、母亲病危的人，真的能那么冷静地安排好一切吗？\n\n也许他回去了。也许一切都好。\n\n但你心里留了一个问号，像阳台那扇没关紧的推拉门，总有风灌进来。";
var END_DARK="空药瓶、焦虑症、越来越封闭的性格、失去的爱情……\n\n你不愿意往那个方向想，但所有线索似乎都在低声告诉你同一个答案。一个长期焦虑的人，失去了女友，母亲又病重，他把药扔了——\n\n你站在阳台上，看着楼下来来往往的人。这间公寓里的故事，也许永远不会有人知道全貌了。\n\n城市就是这样，每天都有人消失，安静得像从未存在过。\n\n你关上阳台的门，决定不再想了。";
var END_MISLEAD="你觉得自己想明白了。\n\n苏晴报了警——说明她后来后悔了。旅行袋里有两人的电影票根和行李牌，合照还被他夹在书里。一个放不下前女友的男人，一个分手后又来报案的女人。\n\n他们和好了，一起离开了这座城市，去了一个没人认识他们的地方。行李袋空了，因为东西都带走了。\n\n但你翻了翻那封分手信的日期——1月15日。火车票是3月2日。中间隔了一个半月。辞职信写的是\"家中有事\"，不是\"个人原因\"。目的地是平远县——他的老家，不是什么浪漫的远方。\n\n你总觉得有什么地方对不上，但又说不清楚是哪里。";
var END_FOG="你看着桌上散落的线索，觉得什么都有可能，又什么都不确定。\n\n日记里的焦虑、信里的告别、药瓶、火车票……每一条线索都像指向不同的方向。你试着把它们串起来，但总有几块拼图放不进去。\n\n你关上了灯，走出房间。\n\n也许有一天你会再打开这个纸箱，重新看一遍。也许答案一直就在那里，只是你还没准备好看到它。\n\n门在身后合上，发出轻轻的一声响。";

  0:[
    {id:3,rect:[0.2,63.4,17.0,9.6]},
    {id:1,rect:[35.4,70.2,14.3,6.1]},
    {id:4,rect:[1.0,77.1,18.8,9.2]},
    {id:2,rect:[75.4,81.6,13.0,7.0]},
    {id:5,rect:[28.4,88.1,16.6,8.5]}
  ],
  1:[
    {id:10,rect:[28.0,68.0,10.0,4.5]},
    {id:6,rect:[47.0,69.0,14.0,5.0]},
    {id:9,rect:[47.0,75.0,14.0,5.0]}
  ],
  2:[
    {id:11,rect:[59.5,42.3,11.1,7.6]},
    {id:15,rect:[41.4,51.8,31.5,14.4]},
    {id:12,rect:[19.5,60.6,12.0,8.0]},
    {id:13,rect:[72.8,80.2,8.8,4.0]},
    {id:14,rect:[72.8,84.5,8.8,4.3]}
  ],
  3:[
    {id:16,rect:[50.59,57.05,8.50,6.78]},
    {id:17,rect:[72.46,54.63,23.34,25.59]},
    {id:18,rect:[50.39,79.05,29.59,14.59]}
  ]
};
var multiClick={6:{seq:[6,7,8],idx:0}};
var TOTAL_KW=19;
var collectedKw={};
var foundItems={};
var comboFlags={};
var currentScene=0;
var nbOpen=false;

var endings=[
  {id:"perfect",title:"平远的春天",subtitle:"完美结局",warm:true,
    test:function(sel){
      var ct=0;if(sel["计划离开"])ct++;if(sel["癌症晚期"])ct++;if(sel["不再回来"])ct++;
      var ml=sel["母亲患病"]||sel["母亲的关心"]||sel["过年的记忆"];
      var rec=sel["处方"]||sel["主动停药"];
      var dW=["焦虑","邻居的关心","丢弃的药瓶","过期食材","温暖"];
      var dc=0;for(var i=0;i<dW.length;i++)if(sel[dW[i]])dc++;
      return ct>=2&&ml&&rec&&dc===0;
    },text:END_PERFECT},
  {id:"regret",title:"窗边的风",subtitle:"遗憾变体",
    test:function(sel){
      var tW=["计划离开","母亲患病","癌症晚期","不再回来","母亲的关心","处方","过年的记忆","主动停药"];
      var tc=0;for(var i=0;i<tW.length;i++)if(sel[tW[i]])tc++;
      var ml=sel["母亲患病"]||sel["母亲的关心"]||sel["过年的记忆"];
      return tc>=3&&ml&&(sel["丢弃的药瓶"]||sel["焦虑"]||sel["温暖"]);
    },text:END_REGRET},
  {id:"dark",title:"空房间",subtitle:"黑暗结局",
    test:function(sel){
      var dW=["焦虑","邻居的关心","丢弃的药瓶","过期食材","温暖"];
      var dc=0;for(var i=0;i<dW.length;i++)if(sel[dW[i]])dc++;
      var rec=sel["处方"]||sel["主动停药"];
      if(dc>=3&&!rec)return true;
      var tW=["计划离开","母亲患病","癌症晚期","不再回来","母亲的关心","处方","过年的记忆","主动停药"];
      var tc=0;for(var j=0;j<tW.length;j++)if(sel[tW[j]])tc++;
      if(dc>=2&&tc<=2&&!rec)return true;
      return false;
    },text:END_DARK},
  {id:"mislead",title:"两张车票",subtitle:"误导结局",
    test:function(sel){
      var mW=["报案人苏晴","旧日回忆","分手","行李牌的目的地"];
      var mc=0;for(var i=0;i<mW.length;i++)if(sel[mW[i]])mc++;
      if(mc>=3)return true;
      var tW=["计划离开","母亲患病","癌症晚期","不再回来","母亲的关心","处方","过年的记忆","主动停药"];
      var tc=0;for(var j=0;j<tW.length;j++)if(sel[tW[j]])tc++;
      if(mc>=2&&tc<=2)return true;
      return false;
    },text:END_MISLEAD},
  {id:"fog",title:"未读的信",subtitle:"迷雾结局",
    test:function(){return true;},text:END_FOG}
];

function kwType(kw){
  if(kw==="主动停药")return "truth";
  for(var id in items){if(items[id].keyword===kw)return items[id].type;}
  return "neutral";
}
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  setTimeout(function(){toastEl.classList.remove("show");},2000);
}
function renderTitle(){
  nbBar.style.display="none";
  app.innerHTML="";
  var d=document.createElement("div");
  d.className="title-screen";
  d.innerHTML='<h1>最后一封信</h1><p>一个人的公寓，藏着他离开的理由</p><button id="startBtn">推开门</button>';
  app.appendChild(d);
  document.getElementById("startBtn").addEventListener("click",renderIntro);
}
function renderIntro(){
  app.innerHTML="";
  var d=document.createElement("div");
  d.className="intro-screen";
  var lines=["门没有锁。你轻轻推开，铰链发出一声低哑的响。","空气里有股久未通风的闷味，混着灰尘和纸张的气息。玄关的鞋架上只剩一双拖鞋，旁边的钥匙挂钩空着。","这里是林远的公寓。他已经消失了将近两个月，没有人知道他去了哪里。","你环顾四周——也许他留下的东西，能告诉你答案。"];
  var html="";
  lines.forEach(function(l){html+="<p>"+l+"</p>";});
  html+='<button id="enterBtn">开始探索</button>';
  d.innerHTML=html;
  app.appendChild(d);
  document.getElementById("enterBtn").addEventListener("click",function(){renderExplore(0);});
}
function renderExplore(scIdx){
  currentScene=scIdx;
  nbBar.style.display="";
  app.innerHTML="";
  var pw=document.createElement("div");
  pw.className="prog-wrap";
  var cnt=Object.keys(collectedKw).length;
  pw.innerHTML='<span class="prog-label">线索 '+cnt+'/'+TOTAL_KW+'</span><div class="prog-bar"><div class="prog-fill" style="width:'+(cnt/TOTAL_KW*100)+'%"></div></div>';
  app.appendChild(pw);
  if(cnt>=Math.ceil(TOTAL_KW*0.5)){
    var rb=document.createElement("div");
    rb.style.cssText="text-align:center;padding:6px 0;margin-top:28px";
    var btn=document.createElement("button");
    btn.className="submit-btn";
    btn.style.cssText="padding:6px 20px;font-size:.82em;margin:0";
    btn.textContent="我想我知道发生了什么……";
    btn.addEventListener("click",renderReasoning);
    rb.appendChild(btn);
    app.appendChild(rb);
  }
  var nav=document.createElement("div");
  nav.className="scene-nav";
  scenes.forEach(function(s,i){
    var b=document.createElement("button");
    b.className="nav-btn"+(i===scIdx?" active":"");
    b.textContent=s.name;
    b.addEventListener("click",function(){renderExplore(i);});
    nav.appendChild(b);
  });
  app.appendChild(nav);
  var sc=document.createElement("div");
  sc.className="scene-container";
  var img=document.createElement("img");
  img.className="scene-img";
  img.src=scenes[scIdx].img;
  img.alt=scenes[scIdx].name;
  sc.appendChild(img);
  var hs=hotspots[scIdx]||[];
  hs.forEach(function(h){
    var el=document.createElement("div");
    el.className="hotspot";
    el.style.left=h.rect[0]+"%";
    el.style.top=h.rect[1]+"%";
    el.style.width=h.rect[2]+"%";
    el.style.height=h.rect[3]+"%";
    el.addEventListener("click",function(){handleHotspotClick(h.id);});
    sc.appendChild(el);
  });
  app.appendChild(sc);
  updateNotebookBar();
}
function handleHotspotClick(id){
  var mc=multiClick[id];
  if(mc){
    var actualId=mc.seq[mc.idx];
    showModal(actualId);
    mc.idx=(mc.idx+1)%mc.seq.length;
    return;
  }
  for(var key in multiClick){
    var g=multiClick[key];
    if(g.seq.indexOf(id)>0)return;
  }
  showModal(id);
}
function showModal(id){
  var it=items[id];
  if(!it)return;
  foundItems[id]=true;
  var overlay=document.createElement("div");
  overlay.className="modal-overlay";
  var modal=document.createElement("div");
  modal.className="modal";
  var img=document.createElement("img");
  img.src=it.img;
  img.alt=it.name;
  modal.appendChild(img);
  var txt=document.createElement("div");
  txt.className="modal-text";
  modal.appendChild(txt);
  var cls=document.createElement("div");
  cls.className="modal-close";
  cls.textContent="[ 关闭 ]";
  modal.appendChild(cls);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  typewriter(txt,it.text,0,function(){acquireKeyword(it);});
  cls.addEventListener("click",function(){document.body.removeChild(overlay);});
  overlay.addEventListener("click",function(e){if(e.target===overlay)document.body.removeChild(overlay);});
}
function typewriter(el,text,i,cb){
  if(i<text.length){
    if(text[i]==="\n"){el.appendChild(document.createElement("br"));}
    else{el.appendChild(document.createTextNode(text[i]));}
    setTimeout(function(){typewriter(el,text,i+1,cb);},30);
  }else{if(cb)cb();}
}
function acquireKeyword(it){
  if(collectedKw[it.keyword])return;
  collectedKw[it.keyword]=true;
  showToast("获得线索关键词："+it.keyword);
  if(it.comboFlag){
    comboFlags[it.comboFlag]=true;
    if(comboFlags["drug"]&&comboFlags["prescription"]){
      if(!collectedKw["主动停药"]){
        setTimeout(function(){
          collectedKw["主动停药"]=true;
          showToast("线索组合触发：主动停药");
          updateNotebookBar();
          updateProgressBar();
        },1500);
      }
    }
  }
  updateNotebookBar();
  updateProgressBar();
}
function updateProgressBar(){
  var cnt=Object.keys(collectedKw).length;
  var fill=document.querySelector(".prog-fill");
  if(fill)fill.style.width=(cnt/TOTAL_KW*100)+"%";
  var label=document.querySelector(".prog-label");
  if(label)label.textContent="线索 "+cnt+"/"+TOTAL_KW;
}
function updateNotebookBar(){
  var kws=Object.keys(collectedKw);
  nbBadge.textContent=kws.length;
  nbBody.innerHTML="";
  kws.forEach(function(kw){
    var sp=document.createElement("span");
    sp.className="nb-item";
    sp.textContent=kw;
    sp.addEventListener("click",function(){showClueDetail(kw);});
    nbBody.appendChild(sp);
  });
}
function showClueDetail(kw){
  var desc="";
  if(kw==="主动停药"){desc=COMBO_TEXT;}
  else{for(var id in items){if(items[id].keyword===kw){desc=items[id].text;break;}}}
  nbDetail.style.display="flex";
  var box=document.createElement("div");
  box.className="nb-detail-box";
  var h3=document.createElement("h3");
  h3.textContent=kw;
  box.appendChild(h3);
  var p=document.createElement("p");
  desc.split("\n").forEach(function(line,idx){
    if(idx>0)p.appendChild(document.createElement("br"));
    p.appendChild(document.createTextNode(line));
  });
  box.appendChild(p);
  var cl=document.createElement("div");
  cl.className="close-btn";
  cl.textContent="[ 关闭 ]";
  cl.addEventListener("click",function(){nbDetail.style.display="none";});
  box.appendChild(cl);
  nbDetail.innerHTML="";
  nbDetail.appendChild(box);
  nbDetail.addEventListener("click",function(e){if(e.target===nbDetail)nbDetail.style.display="none";});
}
nbToggle.addEventListener("click",function(){
  nbOpen=!nbOpen;
  nbBody.classList.toggle("open",nbOpen);
  nbArrow.classList.toggle("open",nbOpen);
});

function renderReasoning(){
  nbBar.style.display="none";
  app.innerHTML="";
  var d=document.createElement("div");
  d.className="reasoning-screen";
  d.innerHTML='<h2>你的推理</h2><p class="sub">你已经收集了足够多的线索。现在，选出你认为能还原林远"失踪"真相的关键词。<br>你的选择将决定这个故事的结局。</p>';
  var grid=document.createElement("div");
  grid.className="kw-grid";
  var selected={};
  Object.keys(collectedKw).forEach(function(kw){
    var btn=document.createElement("button");
    btn.className="kw-btn";
    btn.textContent=kw;
    btn.addEventListener("click",function(){
      selected[kw]=!selected[kw];
      btn.classList.toggle("selected",!!selected[kw]);
    });
    grid.appendChild(btn);
  });
  d.appendChild(grid);
  var sub=document.createElement("button");
  sub.className="submit-btn";
  sub.textContent="提交推理";
  sub.addEventListener("click",function(){
    var sel={};
    Object.keys(selected).forEach(function(k){if(selected[k])sel[k]=true;});
    if(Object.keys(sel).length===0){showToast("请至少选择一个关键词");return;}
    determineEnding(sel);
  });
  d.appendChild(sub);
  app.appendChild(d);
}
function determineEnding(sel){
  var ending=null;
  for(var i=0;i<endings.length;i++){
    if(endings[i].test(sel)){ending=endings[i];break;}
  }
  renderEnding(ending);
}
function renderEnding(e){
  app.innerHTML="";
  if(e.warm)document.body.style.background="#1a1610";
  var d=document.createElement("div");
  d.className="ending-screen";
  var h=document.createElement("h2");
  h.textContent="结局："+e.title;
  d.appendChild(h);
  var sub=document.createElement("p");
  sub.style.color="#999";sub.style.fontSize=".85em";
  sub.textContent=e.subtitle;
  d.appendChild(sub);
  var tw=document.createElement("div");
  tw.style.textAlign="left";
  d.appendChild(tw);
  app.appendChild(d);
  typewriter(tw,e.text,0,function(){
    var fs=document.createElement("div");
    fs.style.cssText="margin-top:32px;padding-top:24px;border-top:1px solid #333;text-align:left";
    var fh=document.createElement("h3");
    fh.style.cssText="color:#c8b880;margin-bottom:12px";
    fh.textContent="完整的故事";
    fs.appendChild(fh);
    var fp=document.createElement("p");
    fp.style.cssText="color:#999;line-height:1.9;font-size:.9em";
    fp.textContent=FULL_STORY;
    fs.appendChild(fp);
    var btn=document.createElement("button");
    btn.className="btn-restart";
    btn.textContent="重新开始";
    btn.addEventListener("click",function(){
      document.body.style.background="#1a1a1a";
      collectedKw={};foundItems={};comboFlags={};currentScene=0;nbOpen=false;
      for(var k in multiClick){multiClick[k].idx=0;}
      renderTitle();
    });
    fs.appendChild(btn);
    d.appendChild(fs);
  });
}
renderTitle();

</script>
